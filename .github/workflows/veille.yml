name: Robot Veille Memoire Fiscale

on:
  schedule:
    - cron: '0 8 * * *' # Le robot mettra le site à jour automatiquement tous les jours à 8h00 UTC
  workflow_dispatch: # Ajoute le bouton pour lancer le robot manuellement quand tu veux

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise le robot à modifier le fichier index.html pour y mettre la veille

    steps:
      - name: Étape 1 - Récupérer les fichiers du projet
        uses: actions/checkout@v4

      - name: Étape 2 - Installer Python sur le serveur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Étape 3 - Installer la bibliothèque Google GenAI
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Étape 4 - Exécuter le script de veille avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # On transmet ta nouvelle clé secrète au script
        run: python script.py

      - name: Étape 5 - Sauvegarder les modifications sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mise à jour automatique de la veille fiscale via Gemini" || echo "Pas de changement"
          git push
